[package]
name = "agile-md"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny filesystem Kanban: markdown tasks moved between todo/, doing/ and done/"
repository = "https://github.com/mrdoodles/agile-md"
license = "MIT"
readme = "README.md"
keywords = ["kanban", "tasks", "markdown", "cli", "git"]
categories = ["command-line-utilities"]

[lib]
name = "agile_md"
path = "src/lib.rs"

[[bin]]
name = "amd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
inquire = "0.9"
minijinja = "2"
tempfile = "3"
richrs = "0.2"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

# GUI only — see the [features] section.
clap_complete = "4"
ratatui = { version = "0.30", optional = true }
ratatui-themes = { version = "0.3", optional = true }

# Desktop GUI — the same stack as rustmark, so the two look and feel alike
# and a ticket body can be handed straight to it.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
], optional = true }
egui = { version = "0.36", optional = true }
libc = "0.2.189"
deunicode = "1.6.2"

[features]
# The terminal front end is on by default: it's the only one, and a build
# without it can't show you the board. `--no-default-features` drops it and
# leaves the CLI, which is what CI and scripts use.
default = ["tui"]
tui = ["dep:ratatui", "dep:ratatui-themes"]
# The desktop board. Off by default: it drags in a windowing stack, and CI and
# scripts only ever want the CLI.
gui = ["dep:eframe", "dep:egui"]

[dev-dependencies]
ratatui = "0.30"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
