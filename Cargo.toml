[package]
name = "agile-md"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny filesystem Kanban: markdown tasks moved between todo/, doing/ and done/"
repository = "https://github.com/mrdoodles/agile-md"
license = "MIT"
readme = "README.md"
keywords = ["kanban", "tasks", "markdown", "cli", "git"]
categories = ["command-line-utilities"]

[lib]
name = "agile_md"
path = "src/lib.rs"

[[bin]]
name = "amd"
path = "src/main.rs"

# The desktop board as a binary of its own. An app is something you launch, not
# a subcommand you have to remember — `amdui` is `amd gui` without the `amd
# gui`. It is a few lines over the library, so the two front ends stay one
# implementation of the board. `required-features` means a build without the
# `gui` feature simply doesn't produce it, rather than failing to compile.
[[bin]]
name = "amdui"
path = "src/bin/amdui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
inquire = "0.9"
minijinja = "2"
tempfile = "3"
richrs = "0.2"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

# GUI only — see the [features] section.
clap_complete = "4"

# Desktop GUI — the same stack as rustmark, so the two look and feel alike
# and a ticket body can be handed straight to it.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
], optional = true }
egui = { version = "0.36", optional = true }
libc = "0.2.189"
deunicode = "1.6.2"

[features]
# The desktop board is on by default: a build that cannot show you the board
# is not what anyone wants from `cargo run`. `--no-default-features` drops it
# and leaves the command line on its own, which is what CI and scripts use and
# what keeps a windowing stack out of a headless build.
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
