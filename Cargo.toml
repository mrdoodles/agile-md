[package]
name = "agile-md"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny filesystem Kanban: markdown tasks moved between todo/, doing/ and done/"
repository = "https://github.com/mrdoodles/agile-md"
license = "MIT"
readme = "README.md"
keywords = ["kanban", "tasks", "markdown", "cli", "git"]
categories = ["command-line-utilities"]

[[bin]]
name = "amd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
inquire = "0.9"
minijinja = "2"
tempfile = "3"
richrs = "0.2"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
